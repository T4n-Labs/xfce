#
# Configuration file for Calamares
---
modules-search: [ local ]

instances:
- id:       remount-efivarfs
  module:   shellprocess
  config:   shellprocess-remount-efivarfs.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - users
  - networkcfg
  - hwclock
  - removeuser
  - packages
  - dracut
  - grubcfg
  - shellprocess@remount-efivarfs
  - bootloader
  - umount
- show:
  - finished

branding: default

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false